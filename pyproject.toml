[project]
name = "fileforge"
version = "1.0.0"
description = "Personal online file converter (Django + engines)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1,<6",
    "django-environ>=0.11",
    "whitenoise>=6.6",
    "reportlab>=5.0",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pypdf>=5.0",
    "pdf2docx>=0.5.8",
]

[dependency-groups]
prod = [
    "gunicorn>=22.0",
    "psycopg[binary]>=3.1",
]

[tool.uv]
package = false
